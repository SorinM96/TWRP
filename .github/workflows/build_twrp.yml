name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get clean

      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses6 libncurses-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 rsync
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync TWRP Minimal Manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir -p /home/runner/work/twrp
          cd /home/runner/work/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
          rm -rf .repo

      - name: Build TWRP
        run: |
          export PATH=~/bin:$PATH
          cd /home/runner/work/twrp
          mkdir -p device/alps/k65v1_64_bsp
          rsync -av --exclude='.git' --exclude='.github' $GITHUB_WORKSPACE/ device/alps/k65v1_64_bsp/
          export ALLOW_MISSING_DEPENDENCIES=true
          export TW_DEFAULT_LANGUAGE="en"
          source build/envsetup.sh
          lunch omni_k65v1_64_bsp-eng
          mka recoveryimage -j$(nproc)
          cp out/target/product/k65v1_64_bsp/recovery.img $GITHUB_WORKSPACE/recovery.img

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-k65v1_64_bsp-recovery
          path: recovery.img
